services:
  # FastAPI + data-mining pipeline. The pipeline runs at build time (~100 s) and writes its tables to
  # Supabase (DATABASE_URL), so workouts recorded in the app survive restarts until the next deploy.
  - type: web
    name: fitmine-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt && python -m fitmine.pipeline run --regenerate --skip-verify
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        # Supabase session pooler URI (Connect > Session pooler), e.g.
        # postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
        sync: false

  # React dashboard (static). Android/mobile folders are not needed here.
  - type: web
    name: fitmine-dashboard
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Set to the fitmine-api URL, e.g. https://fitmine-api.onrender.com (no trailing slash)
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
