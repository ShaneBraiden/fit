services:
  # FastAPI + model training. The pipeline runs at build time (~3 min) and rebuilds the synthetic training
  # tables in Supabase (DATABASE_URL). Accounts and the workouts users record live in separate tables
  # (accounts, auth_tokens, live_*) that the pipeline never touches, so they survive every deploy.
  - type: web
    name: fitmine-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt && python -m fitmine.pipeline run --regenerate --skip-verify
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        # Supabase session pooler URI (Connect > Session pooler), e.g.
        # postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
        sync: false
      - key: ADMIN_EMAILS
        # Comma-separated account emails that can open the model pages on the web app
        sync: false

  # React web app (static): sign-in, the user's own pages, and admin model pages.
  - type: web
    name: fitmine-dashboard
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Set to the fitmine-api URL, e.g. https://fitmine-api.onrender.com (no trailing slash)
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
